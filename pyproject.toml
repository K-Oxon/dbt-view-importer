[project]
name = "dbt-view-importer"
dynamic = ["version"]
description = "Import views from BigQuery to dbt"
readme = "README.md"
authors = [{ name = "K-Oxon", email = "ko1011qfp@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0,<9.0.0",
    "rich>=13.0.0,<16.0.0",
    "google-cloud-bigquery>=3.10.0,<4.0.0",
    "google-cloud-bigquery-datatransfer>=3.11.0,<4.0.0",
    "jinja2>=3.1.2,<4.0.0",
    "pyyaml>=6.0,<7.0",
    "google-cloud-datacatalog-lineage>=0.3.12",
]

[project.scripts]
bq2dbt = "bq2dbt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bq2dbt"]
include = ["py.typed"]

[tool.hatch.version]
path = "src/bq2dbt/__init__.py"

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.9.9",
    "pytest>=9.0.3,<10.0.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = ["mypy>=1.15.0", "pytest>=9.0.3"]

[tool.uv]
exclude-newer = "7 days"
